# Build the static Linux binary and attach it to a release, for each v* tag.
# MoonPie installs this binary, so no machine compiles t2fanrd itself.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add "$TARGET"
      - run: sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target "$TARGET"
      - name: Package
        run: |
          name="t2fanrd-${GITHUB_REF_NAME}-$TARGET.tar.gz"
          tar -czf "$name" -C "target/$TARGET/release" t2fanrd
          echo "ASSET=$name" >> "$GITHUB_ENV"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ASSET" --title "$GITHUB_REF_NAME" --notes "Static x86_64 Linux build of $GITHUB_SHA."
